name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Structural audit
        run: ruby scripts/audit.rb
      - name: Installer syntax
        run: bash -n scripts/install.sh
      - name: Manifests parse
        run: |
          python3 -c "import json;[json.load(open(f)) for f in ['marketplace.json','.claude-plugin/plugin.json','.claude-plugin/marketplace.json']]"
